[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "menoeaze-ml"
version = "1.0.0"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.22.0",
    "pydantic>=1.10",
    "numpy>=1.24",
    "torch>=2.0.0",
    "sentence-transformers>=2.2.0",
    "supabase>=1.0.0",
    "python-jose[cryptography]>=3.3.0",
    "pypdf>=3.0.0",
    "tqdm>=4.60.0",
    "httpx>=0.24.0",
]

[tool.setuptools.packages.find]
include = ["ml_engine*"]
